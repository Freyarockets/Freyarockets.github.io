<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Download Freya Rockets POS">
    <meta name="author" content="Freya Rockets">
    <title>Freya Rockets POS</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XR31TKHP5S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XR31TKHP5S', { anonymize_ip: true });

      function trackPosDownload() {
        gtag('event', 'pos_download', {
          event_category: 'Downloads',
          event_label: 'Freya Rockets POS',
          link_url: 'https://drive.google.com/file/d/1Cf1-YOCvVYWcKobQbBfRFAXo49NzXcRU/view?usp=drivesdk'
        });
      }
    </script>

    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #eaf5ff;
        background: radial-gradient(ellipse at top, #17345a 0%, #0b1425 55%, #070b13 100%);
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 620px);
        padding: 48px 28px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        background: rgba(15, 29, 49, 0.76);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #77dcff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.25rem); }
      .description { margin: 0 auto 30px; color: #c4d2e3; line-height: 1.6; }

      .pos-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 17px 30px;
        border: 0;
        border-radius: 14px;
        color: #071321;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        box-shadow: 0 0 24px rgba(79, 172, 254, 0.38);
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .pos-button:hover, .pos-button:focus-visible {
        transform: translateY(-4px);
        box-shadow: 0 0 34px rgba(79, 172, 254, 0.72);
      }

      .pos-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
      .note { margin: 22px 0 0; color: #91a7c0; font-size: 0.85rem; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Freya Rockets</p>
      <h1>POS Download</h1>
      <p class="description">Get the Freya Rockets POS file from Google Drive.</p>
      <a
        class="pos-button"
        href="https://drive.google.com/file/d/1Cf1-YOCvVYWcKobQbBfRFAXo49NzXcRU/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer"
        onclick="trackPosDownload()"
      >
        <span aria-hidden="true">⬇</span> Download POS
      </a>
      <p class="note">The download opens in a new tab.</p>
    </main>
  </body>
</html>
